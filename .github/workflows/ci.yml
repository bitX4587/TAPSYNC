name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Lint & Type-check (fast feedback, no DB needed) ───────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (all packages)
        run: pnpm -r lint
      - name: Typecheck (all packages)
        run: pnpm -r typecheck

  # ── API unit tests ─────────────────────────────────────────────────────────
  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run API unit tests
        run: pnpm --filter @tapsync/api test

  # ── API e2e / integration tests (needs MongoDB) ───────────────────────────
  test-api-e2e:
    name: API Integration Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm --filter @tapsync/api build
      - name: Run API e2e tests
        run: npx jest --config test/jest-e2e.json --testTimeout=120000 --forceExit
        working-directory: apps/api
        env:
          MONGODB_URI: mongodb://localhost:27017/tapsync-ci
          JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 365d
          GOOGLE_CLIENT_ID: ci-google-client-id
          REVALIDATION_SECRET: ci-revalidation-secret
          NEXT_PUBLIC_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3000
          STORAGE_BUCKET: ci-bucket
          STORAGE_KEY_ID: ci-key-id
          STORAGE_SECRET: ci-storage-secret
          STORAGE_REGION: us-east-1

  # ── Web tests ─────────────────────────────────────────────────────────────
  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run web tests
        run: pnpm --filter @tapsync/web test

  # ── Mobile tests ──────────────────────────────────────────────────────────
  test-mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run mobile tests
        run: pnpm --filter @tapsync/mobile test

  # ── Security audit (runs on PRs to main only) ─────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Dependency audit
        run: node scripts/security-audit.mjs
        continue-on-error: true  # Report but don't block PRs on transitive vulns
